<article class="product-card">
<a class="product-visual" href="{{ url_for('product', product_id=p['id']) }}">
<img src="{{ p['image'] }}" alt="{{ p['name'] }}" loading="lazy">
<button class="heart" onclick="event.preventDefault(); toggleWish(this)">♡</button>
{% if p['badge'] %}<span class="badge">{{ p['badge'] }}</span>{% endif %}
</a>
<div class="product-meta">
<div class="rating">{% if p['live_reviews'] %}★★★★★ <span>{{ p['live_rating'] }}/5 · {{ p['live_reviews'] }} review{% if p['live_reviews'] != 1 %}s{% endif %}</span>{% else %}<span class="no-rating">No reviews yet</span>{% endif %}</div>
<h3><a href="{{ url_for('product', product_id=p['id']) }}">{{ p['name'] }}</a></h3>
<p>{{ p['description'] }}</p>
<div class="price-row"><strong>EGP {{ '{:,}'.format(p['price']) }}</strong><button class="mini-add add-cart" data-id="{{ p['id'] }}" data-name="{{ p['name'] }}" data-price="{{ p['price'] }}" data-image="{{ p['image'] }}">+</button></div>
</div></article>
